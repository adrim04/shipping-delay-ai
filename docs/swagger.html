<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Shipping Delay AI – Swagger</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    // Visor estático del documento OpenAPI. Abrir con un servidor local:
    //   cd docs && python -m http.server 8080  ->  http://localhost:8080/swagger.html
    SwaggerUIBundle({ url: "openapi.yaml", dom_id: "#swagger-ui" });
  </script>
</body>
</html>
